name: macOS app

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install create-dmg
      - run: ./macos/TimeTaggerBar/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTaggerBar
          path: macos/TimeTaggerBar/build/TimeTaggerBar.dmg

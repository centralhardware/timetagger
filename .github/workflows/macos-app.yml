name: macOS app

on:
  # Pushes to main only: a PR branch is already built by the pull_request trigger.
  push:
    branches: [ main ]
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install create-dmg
      - run: ./macos/TimeTaggerBar/build-app.sh
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: TimeTaggerBar
          path: macos/TimeTaggerBar/build/TimeTaggerBar.dmg

name: CI

on:
  workflow_dispatch:
  # Server tests only when something the server is built from changes; a client-only change skips them.
  push:
    branches: [ main ]
    paths: ["server/**", "deploy/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [ main ]
    paths: ["server/**", "deploy/**", ".github/workflows/ci.yml"]

jobs:
  server:
    name: server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # The API tests start an embedded PostgreSQL, so no service container is needed.
      - run: ./gradlew --no-daemon test installDist
        working-directory: server
